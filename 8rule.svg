<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- တည်ငြိမ်သော ရွှေဝါရောင် နောက်ခံ စက်ဝိုင်း (#C49102) -->
  <circle cx="50" cy="50" r="50" fill="#C49102"/>

  <!-- စကားပြော သင်္ကေတ (MASTER WEIGHT - 5.5) -->
  <path d="M 16 50 
           A 34 34 0 1 1 84 50 
           A 34 34 0 0 1 58 82 
           L 50 91 
           L 42 82 
           A 34 34 0 0 1 16 50 Z" 
        fill="none" 
        stroke="#000000" 
        stroke-width="5.5" 
        stroke-linecap="round" 
        stroke-linejoin="miter" 
        stroke-miterlimit="10"/>

  <!-- Scale 0.6 လှည်းဘီး (Rim 5.5 ၊ Spokes 4.5 ဖြင့် အချိုးကျညှိထားသည်) -->
  <g transform="translate(50, 50) scale(0.6) translate(-50, -50)" fill="#000000" stroke="#000000">
    
    <!-- အပြင်ဘက် စက်ဝိုင်းကွင်း (Rim) -->
    <circle cx="50" cy="50" r="32" fill="none" stroke-width="5.5" />
    
    <!-- မဂ္ဂင် ၈ ပါး ဝင်ရိုးချောင်းများ -->
    <g fill="none" stroke-width="4.5" stroke-linecap="round">
      <path d="M 50,50 L 50,18" />
      <path d="M 50,50 L 82,50" />
      <path d="M 50,50 L 50,82" />
      <path d="M 50,50 L 18,50" />
      <path d="M 50,50 L 72.6,27.4" />
      <path d="M 50,50 L 72.6,72.6" />
      <path d="M 50,50 L 27.4,72.6" />
      <path d="M 50,50 L 27.4,27.4" />
    </g>

    <!-- အလယ် ဗဟို ဝင်ရိုး (Hub) -->
    <circle cx="50" cy="50" r="6.5" fill="#000000" stroke="none" />
    
  </g>
</svg>
