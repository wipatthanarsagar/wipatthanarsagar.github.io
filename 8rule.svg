      <path d="M 50,50 Q 55,30 50,10"/>
      <path d="M 50,50 Q 70,55 90,50"/>
      <path d="M 50,50 Q 45,70 50,90"/>
      <path d="M 50,50 Q 30,45 10,50"/>
      <path d="M 50,50 Q 70,35 78,22"/>
      <path d="M 50,50 Q 65,70 78,78"/>
      <path d="M 50,50 Q 30,65 22,78"/>
      <path d="M 50,50 Q 35,30 22,22"/>
    </g>

    <!-- Center Hub: Ultra-Fine Symmetrical Wave -->
    <circle cx="50" cy="50" r="14" fill="#000000" stroke="none"/>
    <g fill="#FFC107" stroke="none">
      <rect x="41" y="48.5" width="1.4" height="3" rx="0.7"/>
      <rect x="43.8" y="45" width="1.4" height="10" rx="0.7"/>
      <rect x="46.6" y="42" width="1.4" height="16" rx="0.7"/>
      <rect x="49.3" y="39.5" width="1.4" height="21" rx="0.7"/>
