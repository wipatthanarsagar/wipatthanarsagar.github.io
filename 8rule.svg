<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- နောက်ခံ စက်ဝိုင်း (#C49102) -->
  <circle cx="50" cy="50" r="50" fill="#C49102"/>

  <!-- ၁။ အချွန်နှင့် စက်ဝိုင်းကြား ဟနေသော ကွက်လပ်အဟလေးကိုပဲ သီးသန့် အမဲရောင် အပြည့်ပိတ်ပေးသည့် Patch -->
  <path d="M 58 82 A 34 34 0 0 1 42 82 L 50 91 Z" fill="#000000" stroke="#000000" stroke-width="1" />

  <!-- ၂။ မူလ စကားပြောသင်္ကေတ Path (ကုဒ် / geometry မူလအတိုင်း လုံးဝမပြောင်းလဲပါ) -->
  <path d="M 16 50 
           A 34 34 0 1 1 84 50 
           A 34 34 0 0 1 58 82 
           L 50 91 
           L 42 82 
           A 34 34 0 0 1 16 50 
           M 58 82 
           A 34 34 0 0 1 42 82" 
        fill="none" 
        stroke="#000000" 
        stroke-width="4.5" 
        stroke-linecap="round" 
        stroke-linejoin="miter" 
        stroke-miterlimit="10"/>

  <!-- အတွင်း မဂ္ဂင် ၈ ပါး ဝင်ရိုးနှင့် ဗဟိုချက် (ဝင်ရိုးအရှည်များ အားလုံး တူညီစွာ 50,82) -->
  <g fill="#000000" stroke="#000000">
    <!-- မဂ္ဂင် ၈ ပါး ဝင်ရိုးများ (Stroke: 2.5) -->
    <g fill="none" stroke-width="2.5" stroke-linecap="round">
      <path d="M 50,50 L 50,18" />
      <path d="M 50,50 L 82,50" />
      <path d="M 50,50 L 50,82" />
      <path d="M 50,50 L 18,50" />
      <path d="M 50,50 L 72.6,27.4" />
      <path d="M 50,50 L 72.6,72.6" />
      <path d="M 50,50 L 27.4,72.6" />
      <path d="M 50,50 L 27.4,27.4" />
    </g>

    <!-- ဗဟိုချက် (r=4.5) -->
    <circle cx="50" cy="50" r="4.5" fill="#000000" stroke="none" />
  </g>
</svg>
