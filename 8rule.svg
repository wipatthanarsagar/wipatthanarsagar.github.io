<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <circle cx="50" cy="50" r="50" fill="#FFC107"/>
  <g fill="#000000" stroke="#000000">
    <!-- အပြင်ဘက် စက်ဝိုင်းကွင်း (stroke-width: 9.0 သို့ ပြောင်းထားသည်) -->
